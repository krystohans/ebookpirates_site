<!-- ─── KVÍZ PANEL OVERLAY ─── -->
<div id="quiz-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99995; align-items: center; justify-content: center; pointer-events: auto;">
  <div id="quiz-panel-box" style="position: relative; width: 831px; height: 768px; max-width: none; max-height: none; transform-origin: center center; background: transparent url('https://storage.googleapis.com/kalozsziget-assets/tutorial/assets/images/airship_quiz_panel_clean.png') no-repeat center center / 100% 100%; padding: 181px 120px 150px 120px; box-sizing: border-box; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.9)); display: flex; flex-direction: column; align-items: center; transition: all 0.2s ease-in-out; pointer-events: auto;">
    
    <div id="quiz-title" style="color: #6b4c2a; font-family: 'Briskb', 'Courier New', monospace; font-size: 18px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;">
      📜 HÁRTYA KVÍZKÉRDÉS
    </div>

    <div id="quiz-question-text" style="color: #1a0a00; font-family: 'Briskb', 'Courier New', monospace; font-size: 20px; font-weight: bold; text-align: center; line-height: 1.35; min-height: 60px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; white-space: pre-wrap;">
      Kérdés betöltése...
    </div>

    <!-- TÉTES JÁTÉK (DUPLA VAGY SEMMI) FELÜLET -->
    <div id="quiz-betting-area" style="display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 15px 0;">
      <div id="quiz-bet-title" style="font-size: 18px; font-weight: bold; color: #ffeb3b; text-shadow: 2px 2px 4px #000; font-family: 'Briskb', 'Courier New', monospace; text-transform: uppercase;">⭐ KIEMELT TÉTES HÁRTYA!</div>
      <div id="quiz-bet-info" style="font-size: 16px; color: #fff; text-shadow: 2px 2px 4px #000; text-align: center; font-family: 'Briskb', 'Courier New', monospace; line-height: 1.4;">
        Kockára teszed a nálad lévő hártyákat dupla vagy semmi alapon?<br>
        <span style="color:#4CAF50; font-weight:bold;">Helyes válasz: DUPLÁZÁS</span> | <span style="color:#f44336; font-weight:bold;">Helytelen: NULLÁZÁS</span>
      </div>
      <div style="display: flex; gap: 15px; justify-content: center; width: 100%; margin-top: 10px;">
        <button id="quiz-bet-yes-btn" style="padding: 10px 22px; background: rgba(230, 110, 15, 0.9); border: 2px solid #ffcc00; color: #fff; font-family: 'Briskb', 'Courier New', monospace; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; text-shadow: 1px 1px 2px #000;">Kockáztatok!</button>
        <button id="quiz-bet-no-btn" style="padding: 10px 22px; background: rgba(60, 60, 60, 0.9); border: 2px solid #aaa; color: #fff; font-family: 'Briskb', 'Courier New', monospace; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; text-shadow: 1px 1px 2px #000;">Nem, sima kérdést kérek</button>
      </div>
    </div>

    <div id="quiz-answers-container" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
      <button class="quiz-ans-btn" data-index="0" style="width: 100%; padding: 12px 18px; background: rgba(20, 10, 5, 0.85); border: 2px solid #6b4c2a; color: #ffeedd; font-family: 'Briskb', 'Courier New', monospace; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.15s ease-in-out;">A) Válasz 1</button>
      <button class="quiz-ans-btn" data-index="1" style="width: 100%; padding: 12px 18px; background: rgba(20, 10, 5, 0.85); border: 2px solid #6b4c2a; color: #ffeedd; font-family: 'Briskb', 'Courier New', monospace; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.15s ease-in-out;">B) Válasz 2</button>
      <button class="quiz-ans-btn" data-index="2" style="width: 100%; padding: 12px 18px; background: rgba(20, 10, 5, 0.85); border: 2px solid #6b4c2a; color: #ffeedd; font-family: 'Briskb', 'Courier New', monospace; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.15s ease-in-out;">C) Válasz 3</button>
      <button class="quiz-ans-btn" data-index="3" style="width: 100%; padding: 12px 18px; background: rgba(20, 10, 5, 0.85); border: 2px solid #6b4c2a; color: #ffeedd; font-family: 'Briskb', 'Courier New', monospace; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.15s ease-in-out;">D) Válasz 4</button>
    </div>

  </div>
</div>
