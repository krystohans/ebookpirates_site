  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'absolute';
      errDiv.style.top = '10px';
      errDiv.style.left = '10px';
      errDiv.style.zIndex = '999999';
      errDiv.style.background = 'red';
      errDiv.style.color = 'white';
      errDiv.style.padding = '20px';
      errDiv.style.fontSize = '20px';
      errDiv.innerHTML = `<h1>JS ERROR</h1><p>${message}</p><p>Line: ${lineno}:${colno}</p><p>${error ? error.stack : ''}</p>`;
      document.body.appendChild(errDiv);
    };
    window.addEventListener('unhandledrejection', function(event) {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'absolute';
      errDiv.style.top = '250px';
      errDiv.style.left = '10px';
      errDiv.style.zIndex = '999999';
      errDiv.style.background = 'orange';
      errDiv.style.color = 'black';
      errDiv.style.padding = '20px';
      errDiv.style.fontSize = '20px';
      errDiv.innerHTML = `<h1>PROMISE ERROR</h1><p>${event.reason}</p>`;
      document.body.appendChild(errDiv);
    });
  </script>

  <script type="importmap">
{ "imports": { 
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { Water } from 'three/addons/objects/Water.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── Wrapper & renderer ───
    const wrap = document.getElementById('game-wrapper');
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.localClippingEnabled = false; // KIKAPCSOLVA A GYOMLÁLÁSHOZ (Clipping Planes)
    renderer.setPixelRatio(1); // FIX: Fixáljuk 1-re, különben nagy felbontású kijelzőn (pl. 4K) drasztikus FPS esést okoz a sok víz-reflexió!
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    function resize() {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      renderer.setSize(w, h);
      cam.aspect = w / h; cam.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    // ─── Scene ───
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec8e8); // FIX: A háttérnek PONTOSAN egyeznie kell a köd színével!
    scene.fog = new THREE.FogExp2(0x7ec8e8, 0.0015); // Erősebb köd a távoli elemek elrejtésére

    // ─── Camera (will orbit the boat — CameraMove.cs port) ───
    const cam = new THREE.PerspectiveCamera(55, wrap.clientWidth / wrap.clientHeight, 0.5, 1000); // 1000-re állítva, hogy a Skydome még beférjen!
    let orbH = 222.75, orbV = 31.60, orbDist = 26.00; // Magasabb, lefelé néző szög a tető elkerülése végett
    const ORB_MIN_V = 2, ORB_MAX_V = 65, ORB_MIN_D = 5, ORB_MAX_D = 200;

    // IDEIGLENES ORBIT KAMERA
    window.tempOrbit = new OrbitControls(cam, renderer.domElement);
    window.tempOrbit.target.set(0, 0, 0);

    // Expose camera variables for the UI editor
    window.getOrbH = () => orbH;
    window.getOrbV = () => orbV;
    window.getOrbDist = () => orbDist;
    window.setOrb = (h, v, d) => { orbH = h; orbV = v; orbDist = d; };
    const ORB_SENS_H = 0.25, ORB_SENS_V = 0.2;
    const LOOK_OFFSET_Y = 2.5;

    // ─── Lights ───
    scene.add(new THREE.AmbientLight(0x8ab4d0, 0.55));
    const sun = new THREE.DirectionalLight(0xfff4d6, 1.3);
    sun.position.set(2200, 150, 1350); // A felhasználó által kért új nap-pozíció
    sun.castShadow = false; // GPU árnyékszámítás kikapcsolva a villámgyors 60 FPS-ért!
    scene.add(sun);

    // Másodlagos fényforrás a hegy tetejéről (a felhasználó kérése alapján)
    const mountainLight = new THREE.DirectionalLight(0xffeedd, 0.6); // Kicsit erősebbre véve
    mountainLight.position.set(-900, 1500, 600); // Még magasabbra emelve (500-ról 1500-ra)
    scene.add(mountainLight);
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x305030, 0.35));

    // ─── Sky dome (gradient) ───
    let skyDome;
    {
      const g = new THREE.SphereGeometry(950, 32, 16);
      const cols = [];
      const p = g.getAttribute('position');
      for (let i = 0; i < p.count; i++) {
        const t = (p.getY(i) / 950 + 1) * 0.5;
        cols.push(
          THREE.MathUtils.lerp(0.92, 0.35, t),
          THREE.MathUtils.lerp(0.78, 0.58, t),
          THREE.MathUtils.lerp(0.55, 0.88, t));
      }
      g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      skyDome = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true }));
      scene.add(skyDome);
    }

    // ─── Water plane (Realistic) ───
    const waterGeo = new THREE.PlaneGeometry(2400, 2400);
    const water = new Water(
      waterGeo,
      {
        textureWidth: 256,
        textureHeight: 256,
        waterNormals: new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/waternormals.jpg', function (texture) {
          texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        }),
        sunDirection: sun.position.clone().normalize(),
        sunColor: 0xffffff,
        waterColor: 0x1476a6,
        distortionScale: 3.7,
        fog: scene.fog !== undefined
      }
    );
    water.rotation.x = -Math.PI / 2;
    scene.add(water);

    // ─── Sea floor ───
    {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), new THREE.MeshLambertMaterial({ color: 0x0e2a1e }));
      m.rotation.x = -Math.PI / 2; m.position.y = -18; scene.add(m);
    }

    // ─── Helper: rocky shape ───
    function rockMesh(radius, height, color, flatten = 1) {
      const g = new THREE.DodecahedronGeometry(radius, 1);
      const p = g.getAttribute('position');
      for (let i = 0; i < p.count; i++) {
        p.setX(i, p.getX(i) + (Math.random() - 0.5) * radius * 0.35);
        p.setY(i, p.getY(i) * flatten);
        p.setZ(i, p.getZ(i) + (Math.random() - 0.5) * radius * 0.35);
      }
      g.computeVertexNormals();
      const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color }));
      m.castShadow = true; m.receiveShadow = true;
      return m;
    }

    // ─── Unity Level Data Loader ───
    const obstacles = [];

    fetch('unity_level_data.json')
      .then(res => res.json())
      .then(unityData => {
        for (const obj of unityData) {
          if (obj.name.includes("Boat") || obj.name.includes("Sails") || obj.name.includes("Mast")) continue;

          let r = 5;
          const lower = obj.name.toLowerCase();

          // Csak az ütközési sugarakat (r) számoljuk ki a JSON alapján
          if (lower.includes("island")) {
            r = 60 * obj.scale[0];
          } else if (lower.includes("rock") || lower.includes("zatony")) {
            let isReef = lower.includes("zatony");
            r = isReef ? 8 : 20;
          } else if (lower.includes("shipwreck")) {
            r = 10;
          } else continue;

          // Pozíció konverzió (Unity LHS -> Three.js RHS)
          const posX = obj.position[0];
          const posZ = -obj.position[2];

          // Ütközés (Collision) hozzáadása a láthatatlan fizikai térképhez
          obstacles.push({ pos: new THREE.Vector2(posX, posZ), r: r * 0.85 });
        }
      })
      .catch(err => console.error("Hiba a pálya betöltésekor:", err));

    // ─── Unity FullTrack.glb Loader (Visuals) ───
    // Ha a pálya a víz alatt van, ezzel az értékkel emelhetjük meg az egész világot (Y tengelyen)
    const TRACK_OFFSET_Y = 1.5;

    function optimizeWithInstancing(sceneGroup, mainScene) {
      console.log("[Auto-Instancing] Optimalizálás megkezdése a FullTrack.glb-n...");
      const groups = {};
      
      sceneGroup.traverse((child) => {
          if (child.isMesh && !child.userData.excludeFromInstancing) {
              const geomId = child.geometry.uuid;
              const matId = child.material ? (Array.isArray(child.material) ? child.material[0].uuid : child.material.uuid) : 'nomat';
              const key = geomId + "_" + matId;
              
              if (!groups[key]) {
                  groups[key] = {
                      meshes: [],
                      originalGeometry: child.geometry,
                      // Ha a material tömb (multi-material), csak az elsőt használjuk, mert az InstancedMesh csak 1 materialt támogat alapból.
                      originalMaterial: Array.isArray(child.material) ? child.material[0] : child.material,
                      sampleName: child.name
                  };
              }
              groups[key].meshes.push(child);
          }
      });

      let totalSaved = 0;
      
      for (let key in groups) {
          const group = groups[key];
          if (group.meshes.length > 5) { // 5-nél több példány esetén optimalizálunk
              const count = group.meshes.length;
              const instancedMesh = new THREE.InstancedMesh(group.originalGeometry, group.originalMaterial, count);
              instancedMesh.castShadow = false; // Kikapcsoljuk az árnyékot a maximális sebességért
              instancedMesh.receiveShadow = false;
              
              for (let i = 0; i < count; i++) {
                  const mesh = group.meshes[i];
                  // A mesh már megkapta a sceneGroup skáláját a korábbi updateMatrixWorld miatt
                  instancedMesh.setMatrixAt(i, mesh.matrixWorld);
                  
                  // Eredeti mesh eltávolítása a memóriából a WebGL Context Lost megelőzése érdekében!
                  mesh.geometry.dispose(); 
                  mesh.visible = false; 
                  // Ütközésekhez még használható marad, ha a raycaster false mesh-eket is vizsgál
              }
              
              mainScene.add(instancedMesh);
              console.log(`[Auto-Instancing] Optimalizálva: ${group.sampleName} (${count} példány).`);
              totalSaved += count;
          }
      }
      console.log(`[Auto-Instancing] Kész! Összesen ${totalSaved} db háló lett összevonva, ami megmenti a videókártyát az összeomlástól!`);
    }

      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();

    window.spawnHartyaWave = function (count, mode) {
      const hPos = window.homePos || { x: 200, y: 0, z: -200 };
      let actualSpawned = 0;

      for (let i = 0; i < count; i++) {
        let hx = 0, hz = 0;
        let valid = false;
        let attempts = 0;
        
        while (!valid && attempts < 500) {
            attempts++;
            
            if (mode === 'pier') {
              // PIER mód: a homePos körül 30-80m sugarú gyűrűben, a vízben
              const angle = Math.random() * Math.PI * 2;
              const radius = 30 + Math.random() * 50; // 30-80m
              hx = hPos.x + Math.cos(angle) * radius;
              hz = hPos.z + Math.sin(angle) * radius;
            } else {
              // GAUSS mód: a két korong bounding box-ában
              hx = -680 + Math.random() * (628 - (-680));
              hz = -125 + Math.random() * (1286 - (-125));

              // Zóna teszt: benne van valamelyik korongban?
              const dist1 = Math.hypot(hx - (-124), hz - 732);
              const dist2 = Math.hypot(hx - 164, hz - 342);
              if (dist1 > 553.5 && dist2 > 464) continue; // Nincs korongban → újrapróba
            }

            // MAGASSÁG TESZT (Raycaster Y=100-ból lefelé)
            if (typeof window.fullTrack !== 'undefined' && window.fullTrack) {
                const raycaster = new THREE.Raycaster(new THREE.Vector3(hx, 100, hz), new THREE.Vector3(0, -1, 0));
                const hits = raycaster.intersectObject(window.fullTrack, true);
                
                if (hits.length > 0) {
                    const hit = hits[0];
                    // Csak ha a legfelső pont a vízszint alatt van (nincs szikla/fa/épület)
                    if (hit.point.y <= 2.0) {
                        valid = true;
                    }
                } else {
                    // Nincs hit → nyílt víz (semmi alatta), valid
                    valid = true;
                }
            } else {
                valid = true; // Biztonsági tartalék, ha nincs track
            }
        }

        if (valid) {
          const mMesh = createMembraneMesh(hx, 0.1, hz);
          scene.add(mMesh);
          window.activeMembranes.push(mMesh);
          window.totalSpawnedCount++;
          actualSpawned++;
        } else {
          console.warn(`⚠️ Hártya #${i+1} nem tudott vízre spawn-olni 500 próba után! Kihagyva.`);
        }
      }
      console.log(`🌟 Hullám (${mode}) lehelyezett ${actualSpawned}/${count} új hártyát! Összesen lehelyezve: ${window.totalSpawnedCount}`);

    // 🌊 Procedurális V-Alakú Háromszög Farvíz Textúra (A hajó fara felé mutató vízfodrok)
    function createFoamTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 128, 128);

      // V-alakú háromszög színátmenet a csúcstól az alapig
      const grad = ctx.createLinearGradient(64, 10, 64, 118);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
      grad.addColorStop(0.35, 'rgba(215, 242, 255, 0.45)');
      grad.addColorStop(0.75, 'rgba(175, 225, 255, 0.15)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      // Háromszög kirajzolása (a csúcsa a hajó fara felé mutat)
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(64, 10);   // Csúcs felül (a hajó fara felé)
      ctx.lineTo(118, 118); // Jobb alsó sarok
      ctx.lineTo(10, 118);  // Bal alsó sarok
      ctx.closePath();
      ctx.fill();

      // Belső V-alakú fodrozódó vonalak
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.50)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(64, 30);
      ctx.lineTo(102, 105);
      ctx.moveTo(64, 30);
      ctx.lineTo(26, 105);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.30)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(64, 55);
      ctx.lineTo(88, 105);
      ctx.moveTo(64, 55);
      ctx.lineTo(40, 105);
      ctx.stroke();

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

             } 
             // Első leadás (amikor még csak 1 van) -> lerakunk még 5-öt, ahogy eredetileg is volt!
             else if (window.storedMembranes < 5 && window.totalSpawnedCount === 1) {
                if (typeof window.spawnHartyaWave === 'function') {
                   window.spawnHartyaWave(5, 'pier');
                }
             }
          }
        }
      }

      // 🗨️ Popup 4: Mólóelhagyás detektálása az 1. leadás után
      if (window._waitingForPierLeave && window.homePos) {
        const dxP = boat.position.x - window.homePos.x;
        const dzP = boat.position.z - window.homePos.z;
        if (dxP * dxP + dzP * dzP > 2500.0) { // 50m-nél távolabb → elhagyta a mólót
          window._waitingForPierLeave = false;
          window.showPopUp("Figyelj a szélirányra, úgy forgasd a vitorlát!");
        }
      }

      // ─── LÉGHAJÓ FELEMELKEDÉS ÉS ANIMÁCIÓ (3 FÁZIS) ───
      if (window.airshipAscentStarted && window.foundZeppelin) {
        if (typeof window.airshipTimer !== 'undefined') {
          window.airshipTimer += dt;
          

          
          // FOLYAMATOS ANIMÁCIÓ (Nincsenek megakadások)
          // 1. Mindig emelkedik egy kicsit (max 80m-ig)
          if (window.foundZeppelin.position.y < 50.0) {
            window.foundZeppelin.position.y += dt * 15.0; 
          }
          
          // 2. és 3. Finom ráfordulás és repülés a célpont felé a modell tengelyéhez igazítva (+45 fokos korrekcióval)
          const flyTarget = new THREE.Vector3(20, 50, -100);
          const dir = new THREE.Vector3().subVectors(flyTarget, window.foundZeppelin.position).normalize();
          const targetRotY = Math.atan2(dir.x, dir.z) - Math.PI;
          window.foundZeppelin.rotation.y += (targetRotY - window.foundZeppelin.rotation.y) * dt * 1.5;

          if (window.airshipTimer > 2.5) {
            window.airshipSpeed += dt * 35.0; 
            window.foundZeppelin.position.add(dir.multiplyScalar(dt * window.airshipSpeed));
          }
        }
      }


      // ─── 🏆 EoG: PONT A TRIGGER (Öböl bejárat – "Gyanúsan üres a víz...") ───
      if (window.eogState === 'EMPTIED' && !window.eogTriggerA) {
        const dxA = boat.position.x - EoG_POINT_A.x;
        const dzA = boat.position.z - EoG_POINT_A.z;
        if (dxA * dxA + dzA * dzA < 10000) { // 100m sugarú trigger zóna
          window.eogTriggerA = true;
          window.eogState = 'POINT_A_SHOWN';
          if (!window.chestModel) spawnEogTreasureChest(scene, EoG_POINT_C);
          window.isCutscenePlaying = true; // Megállítjuk a csónakot amíg Zozó beszél
          showZozoEogMonolog(
            'Te, Patkány! Gyanúsan üres a víz...\nNézzük meg, hogy mi a helyzet\naz öböl szájánál!',
            function() {
              window.isCutscenePlaying = false; // Visszaadjuk az irányítást
              window.eogState = 'POINT_A_SHOWN'; // Marad, amíg el nem érjük B-t
            }
          );
          console.log('🏆 EoG Pont A elérve! Zozó 1. EoG monológ...');
        }
      }

      // ─── 🏆 EoG: PONT B TRIGGER (Öböl szája – "Mi az ott a parton?") ───
      // Ha POINT_A_SHOWN már megvolt, VAGY ha EMPTIED (játékos megkerülte A-t) – mindkét esetben tüzel!
      if ((window.eogState === 'POINT_A_SHOWN' || window.eogState === 'EMPTIED' || window.eogState === 'CHEST_VISIBLE') && !window.eogTriggerB) {
        const dxB = boat.position.x - EoG_POINT_B.x;
        const dzB = boat.position.z - EoG_POINT_B.z;
        if (dxB * dxB + dzB * dzB < 3600) { // 60m sugarú trigger zóna
          window.eogTriggerB = true;
          window.isCutscenePlaying = true;
          function showBMonolog() {
            showZozoEogMonolog(
              'Mi az ott a parton?\nAz nem hártya, hanem...\nCsak nem...? Az ott egy LÁDA!\nEGY LÁDA! Gyorsan, fel kell szednünk!',
              function() {
                window.isCutscenePlaying = false;
                window.eogState = 'POINT_B_SHOWN';
              }
            );
          }
          // Ha A monológ nem volt meg (játékos megkerülte), előbb azt mutatjuk
          if (!window.eogTriggerA) {
            window.eogTriggerA = true;
            window.eogState = 'POINT_A_SHOWN';
            if (!window.chestModel) spawnEogTreasureChest(scene, EoG_POINT_C);
            showZozoEogMonolog(
              'Te, Patkány! Gyanúsan üres a víz...\nNézzük meg, hogy mi a helyzet\naz öböl szájánál!',
              function() { showBMonolog(); }
            );
          } else {
            showBMonolog();
          }
          console.log('🏆 EoG Pont B elérve! Zozó EoG monológ sorozat...');
        }
      }

      // ─── 🏆 EoG: KINCSESLÁDA MEGKÖZELÍTÉS TRIGGER ───
      if (!window.eogTriggerChest && window.chestModel) {
        const distToChest = Math.hypot(boat.position.x - window.chestModel.position.x, boat.position.z - window.chestModel.position.z);
        if (distToChest < EoG_CHEST_TRIGGER_DIST) {
          console.log("🔥 LÁDA FELVÉTEL TRIGGER FOT! Távolság:", distToChest);
          window.eogTriggerChest = true;
          window.eogState = 'CHEST_FOUND';
          window.chestModel.visible = false; // Láda eltűnik
          if (window.chestGlowDisc) window.chestGlowDisc.visible = false; // Fény eltűnik
          try { playEogFanfare(); } catch(e) { console.error("Fanfár hiba:", e); }
          window.isCutscenePlaying = true; // Csónak megáll
          showZozoEogMonolog(
            'Most én viszem vissza a csónakot\na mólóra.\nNem hagyom, hogy ezt elszúrd nekem!',
            function() {
              // A csónak irányítása MARAD letiltva – a cinematic vezérli vissza!
              startEogCinematic(scene, boat);
            }
          );
        }
      }

      // ─── 🏆 EoG: CINEMATIC AUTO-NAVIGÁCIÓ (Csónak visszahajózik a mólóra) ───
      // ─── EoG: CINEMATIC AUTO-NAVIGACIO (12mp-es visszauti animacio, orbit kamerával) ───
      if (window.eogState === 'CINEMATIC' && window.eogCinematicPath) {
        const elapsed = (performance.now() - window.eogCinematicStartTime) / 1000;
        const DURATION = 22.0; // Picit hosszabb ido (18mp) a kanyargos ut miatt
        const t = Math.min(elapsed / DURATION, 1.0);
        
        // Hajo pozicio es irany a gorben
        const pos = window.eogCinematicPath.getPoint(t);
        boat.position.copy(pos);
        boat.position.y = 0;
        
        // Hajo nezen a haladasi iranyba (tangens)
        if (t < 0.90) {
          const tangent = window.eogCinematicPath.getTangent(t);
          const targetAngle = Math.atan2(-tangent.x, -tangent.z) ;
          boat.rotation.y = targetAngle;
          // Kamera fixalasa a hajo mogott
          window.setOrb((targetAngle * 180 / Math.PI) , 31.60, 26.00);
        }
        
        // Megerkezett!
        if (t >= 1.0 && !window.eogPierArrived) {
          window.eogPierArrived = true;
          console.log('Megerkeztunk a 34, 0, -68 ponthoz');
          if (typeof showChestAtPier === 'function') showChestAtPier(scene);
          // Egyelore itt varunk, ahogy kerted (kesobb johet a beparkolas)
        }
      }

      const debugUI = document.getElementById('debug-coords');
      if (debugUI && typeof boat !== 'undefined') {
        let zeppPos = 'Not Found';
        let dist = 'N/A';
        if (typeof window.foundZeppelin !== 'undefined' && window.foundZeppelin) {
          zeppPos = "(" + window.foundZeppelin.position.x.toFixed(0) + ", " + window.foundZeppelin.position.y.toFixed(0) + ", " + window.foundZeppelin.position.z.toFixed(0) + ")";
          dist = boat.position.distanceTo(window.foundZeppelin.position).toFixed(0);
        }
        // EoG állapot kijelzése a debug panelen
        const eogInfo = window.eogState !== 'NONE' ? '<br><span style="color:#ffd700">EoG: ' + window.eogState + '</span>' : '';
        debugUI.innerHTML = "Boat: (" + boat.position.x.toFixed(0) + ", " + boat.position.y.toFixed(0) + ", " + boat.position.z.toFixed(0) + ")<br>Airship: " + zeppPos + "<br>Distance: " + dist + " m" + eogInfo;
      }

      // Water animation
      // Water animation

      if (water && water.material.uniforms['time']) {
        water.material.uniforms['time'].value += dt;
      }

      // ─── PlayerController.cs FixedUpdate ───
      const SPEED = 120, TURN = 75;
      let mv = 0, tr = 0;
      if (!window.isCutscenePlaying) { // Csak akkor irányítható a csónak, ha nem fut az átvezető!
        if (keys.KeyW || keys.ArrowUp) mv = 1;
        if (keys.KeyS || keys.ArrowDown) mv = -1;
        if (keys.KeyA || keys.ArrowLeft) tr = -1;
        if (keys.KeyD || keys.ArrowRight) tr = 1;
      }

      _prevPos.copy(boat.position);
      const prevRot = boat.rotation.y;

      if (Math.abs(mv) > 0.01) {
        const dir = mv < 0 ? -1 : 1;
        boat.rotation.y -= tr * dir * (TURN * Math.PI / 180) * dt;
        let spd = SPEED;
        if (mv < 0) spd *= 0.5;
        _fwd.set(0, 0, -1).applyQuaternion(boat.quaternion);
        _step.copy(_fwd).multiplyScalar(mv * spd * dt);
        boat.position.add(_step);
      } else if (Math.abs(tr) > 0.01) {
        boat.rotation.y -= tr * (TURN * Math.PI / 180) * dt;
      }

      let collisionDetected = false;
      let hitHeight = 0;

      const collisionTargets = borderMeshes;

      _center.copy(boat.position);
      _center.y += 0.5;

      if (collisionTargets.length > 0) {
        laserLines.forEach((lItem, idx) => {
          _rayDir.set(0, 0, -1);
          _rayDir.applyAxisAngle(_upAxis, lItem.w.angle);
          _rayDir.applyQuaternion(boat.quaternion).normalize();

          _sharedRaycaster.set(_center, _rayDir);
          const intersects = _sharedRaycaster.intersectObjects(collisionTargets, false);

          if (intersects.length > 0 && intersects[0].distance < lItem.w.dist) {
            collisionDetected = true;
            lItem.mat.color.setHex(0xff2200); // Piros lézer ütközéskor!
            const hitObj = intersects[0].object;
            if (hitObj.geometry) {
              if (!hitObj.geometry.boundingBox) hitObj.geometry.computeBoundingBox();
              hitHeight = hitObj.geometry.boundingBox ? hitObj.geometry.boundingBox.max.y : 0;
            }
          } else {
            lItem.mat.color.setHex(0x00ffcc); // Ciánkék lézer ha tiszta az út!
          }
        });
      }

      if (collisionDetected) {
        boat.position.copy(_prevPos);
        boat.rotation.y = prevRot;

        if (hitHeight < 3.0) {
          // 🗨️ Popup 2: Ütközés
          window.showPopUp("Óvatosabban! Összetörted a csónakot!");
        }
      }

      // Hajó lágy ringása a vízen - KIKAPCSOLVA A FELHASZNÁLÓ KÉRÉSÉRE
      // boat.position.y = -0.5 + Math.sin(t*1.4)*0.22;
      // boat.rotation.z = Math.sin(t*0.75)*0.035;
      // boat.rotation.x = Math.sin(t*1.1)*0.02;

      // 🌊 FAHAJÓ / EVEZŐS SŰRŰ V-ALAKÚ FARVÍZ (DENSE V-WAKE)
      if (Math.abs(mv) > 0.01) {
        // Középső gerinc fodor (central keel triangle)
        const wakeMatC = getPooledWakeMaterial();
        const wakeC = new THREE.Mesh(wakeGeo, wakeMatC);
        wakeC.rotation.x = -Math.PI / 2;
        wakeC.rotation.z = boat.rotation.y;
        const offsetC = new THREE.Vector3(0, 0, 3.0).applyQuaternion(boat.quaternion);
        wakeC.position.copy(boat.position).add(offsetC);
        wakeC.position.y = 0.15;
        wakeC.userData.vel = new THREE.Vector3(0, 0, 0.35).applyQuaternion(boat.quaternion);
        scene.add(wakeC);
        boatWakes.push(wakeC);

        // Bal & Jobb sűrű V-ágak
        const wakeMatL = getPooledWakeMaterial();
        const wakeL = new THREE.Mesh(wakeGeo, wakeMatL);
        wakeL.rotation.x = -Math.PI / 2;
        wakeL.rotation.z = boat.rotation.y;
        const offsetL = new THREE.Vector3(-0.35, 0, 3.2).applyQuaternion(boat.quaternion);
        wakeL.position.copy(boat.position).add(offsetL);
        wakeL.position.y = 0.15;
        wakeL.userData.vel = new THREE.Vector3(-0.18, 0, 0.38).applyQuaternion(boat.quaternion);
        scene.add(wakeL);
        boatWakes.push(wakeL);

        const wakeMatR = getPooledWakeMaterial();
        const wakeR = new THREE.Mesh(wakeGeo, wakeMatR);
        wakeR.rotation.x = -Math.PI / 2;
        wakeR.rotation.z = boat.rotation.y;
        const offsetR = new THREE.Vector3(0.35, 0, 3.2).applyQuaternion(boat.quaternion);
        wakeR.position.copy(boat.position).add(offsetR);
        wakeR.position.y = 0.15;
        wakeR.userData.vel = new THREE.Vector3(0.18, 0, 0.38).applyQuaternion(boat.quaternion);
        scene.add(wakeR);
        boatWakes.push(wakeR);
      }

      // Vízfodrok animálása (sűrű, finom tágulás)
      const timeScale = dt * 60;
      for (let i = boatWakes.length - 1; i >= 0; i--) {
        let w = boatWakes[i];
        if (w.userData.vel) {
          w.position.addScaledVector(w.userData.vel, dt);
        }
        w.scale.x += 0.009 * timeScale;
        w.scale.y += 0.009 * timeScale;
        
        // Eredeti logika, csak egy picit gyorsabban oszlik el az egész csík (0.0032 helyett 0.008)
        w.material.opacity -= 0.008 * timeScale;
        
        if (w.material.opacity <= 0) {
          scene.remove(w);
          boatWakes.splice(i, 1);
        }
      }

      // ─── CameraMove.cs LateUpdate & CUTSCENE KAMERA ───
      if (window.tempOrbitEnabled && window.tempOrbit) {
        window.tempOrbit.update();
      } else {
        if (window.eogState === 'CINEMATIC' && window.homePos) {
          // EoG Cinematic: orbit kamera kovetik a hazatero csónakot (indulasi nezopont)
          const hR = orbH * Math.PI / 180, vR = orbV * Math.PI / 180;
          cam.position.set(
            boat.position.x + orbDist * Math.sin(hR) * Math.cos(vR),
            boat.position.y + orbDist * Math.sin(vR) + LOOK_OFFSET_Y,
            boat.position.z + orbDist * Math.cos(hR) * Math.cos(vR)
          );
          cam.lookAt(boat.position.x, boat.position.y + LOOK_OFFSET_Y, boat.position.z);
        } else if (window.isCutscenePlaying && window.airshipAscentStarted && !window.airshipAscentDone && window.foundZeppelin && window.homePos) {
          // Airship cutscene: statikus filmes sziklarol nezi a leghajot
          cam.position.set(-374, 15, 1347);
          cam.lookAt(window.foundZeppelin.position);
        } else {
          const hR = orbH * Math.PI / 180, vR = orbV * Math.PI / 180;
          cam.position.set(
            boat.position.x + orbDist * Math.sin(hR) * Math.cos(vR),
            boat.position.y + orbDist * Math.sin(vR) + LOOK_OFFSET_Y,
            boat.position.z + orbDist * Math.cos(hR) * Math.cos(vR)
          );
          cam.lookAt(boat.position.x, boat.position.y + LOOK_OFFSET_Y, boat.position.z);
        }
      }

      water.position.x = cam.position.x;
      water.position.z = cam.position.z;
      if (skyDome) {
        skyDome.position.x = cam.position.x;
        skyDome.position.z = cam.position.z;
      }

      renderer.render(scene, cam);
    }
    frame();


    // ═══════════════════════════════════════════════════════════════════════
    // 🏆 EoG (END OF GAME) FÜGGVÉNYEK
    // ═══════════════════════════════════════════════════════════════════════

    // ─── Zozó EoG Monológ – KOMPAKT INLINE DIALOG (nem változtatja a hátteret!) ───
    window.showZozoEogMonolog = function(text, onCloseCallback) {
      const dialog = document.getElementById('eog-compact-dialog');
      const textEl  = document.getElementById('eog-dialog-text');
      if (!dialog || !textEl) return;

      textEl.innerText = text;
      dialog.style.display = 'block';

      function closeEogDialog() {
        dialog.style.display = 'none';
        document.removeEventListener('keydown', onKey);
        dialog.removeEventListener('click', onClick);
        if (typeof onCloseCallback === 'function') onCloseCallback();
      }

      function onKey(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        closeEogDialog();
      }

      function onClick() { closeEogDialog(); }

      // 350ms késleledés: megakadályozza, hogy az aktiváló kattintás azonnal lezárja!
      setTimeout(function() {
        document.addEventListener('keydown', onKey, { once: true });
        dialog.addEventListener('click', onClick, { once: true });
      }, 350);
    };
    // ─── Kincsesláda spawn a C ponton ───
    function spawnEogTreasureChest(sceneRef, point) {
      const loader = new GLTFLoader();

      // Láda test betöltése
      loader.load('./models/pirates_assets/SM_Prop_Chest_Treasure_01.glb', function(gltf) {
        window.chestModel = gltf.scene;
        window.chestModel.position.set(-382, 2.0, 1238);
        window.chestModel.scale.set(250, 250, 250);
        sceneRef.add(window.chestModel);
        // Világosabb textúra és csillogás
        window.chestModel.traverse(function(child) {
          if (child.isMesh && child.material) {
            child.material.emissive = new THREE.Color(0x332200);
            child.material.roughness = 0.3;
            child.material.metalness = 0.8;
            child.material.needsUpdate = true;
          }
        });
        
        // Brutális arany fény a láda körül (scene-be téve, nem a skálázott ládába)
        const discGeom = new THREE.CylinderGeometry(1, 1, 0.5, 32);
        const discMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.7 });
        const glowDisc = new THREE.Mesh(discGeom, discMat);
        glowDisc.position.set(-382, 1.0, 1238);
        sceneRef.add(glowDisc);
        
        const chestLight = new THREE.PointLight(0xffaa00, 150.0, 800);
        chestLight.position.set(0, 0.5, 0); // Fény a korongon belül / közvetlen felette
        glowDisc.add(chestLight);
        window.chestGlowLight = chestLight;
        window.chestGlowDisc = glowDisc;
        window.eogState = 'CHEST_VISIBLE';
        console.log('🏆 Kincsesláda megjelent a C ponton:', point.x, point.z);
      }, undefined, function(err) {
        console.warn('Kincsesláda betöltési hiba:', err);
        // Fallback: arany gömb, ha a GLB nem tölt be
        const fallback = new THREE.Mesh(
          new THREE.BoxGeometry(2, 1.5, 1.2),
          new THREE.MeshStandardMaterial({ color: 0xc8a040, roughness: 0.4, metalness: 0.7 })
        );
        fallback.position.set(point.x, 0.75, point.z);
        sceneRef.add(fallback);
        window.chestModel = fallback;
        window.eogState = 'CHEST_VISIBLE';
      });
    }

    // ─── EoG Cinematic indítása (Csónak visszahajózik, láda megjelenik a mólón) ───
    function startEogCinematic(sceneRef, boatRef) {
      window.eogState = 'CINEMATIC';
      if (window.lantern1Light) window.lantern1Light.intensity = 140.0;
      if (window.lantern2Light) window.lantern2Light.intensity = 140.0;
      if (window.smallLantern1Light) window.smallLantern1Light.intensity = 140.0;
      if (window.smallLantern2Light) window.smallLantern2Light.intensity = 140.0;
      window.eogPierArrived = false;
      window.eogLidAngle = 0;
      window.eogCinematicStartTime = performance.now();
      
      // Kanyargos utvonal (CatmullRomCurve3) definialasa a sziklak kikerulesere
      const startPos = boatRef.position.clone();
      const targetPos = new THREE.Vector3(34, 0, -68);
      
      window.eogCinematicPath = new THREE.CatmullRomCurve3([
        startPos, // Indulas (kincseslada / obol belseje)
        new THREE.Vector3(-427, 0, 1191), // B pont
        new THREE.Vector3(-100, 0, 550),  // A pont
        new THREE.Vector3(28, 0, 1),      // Uj C pont a kikeruleshez
        new THREE.Vector3(38, 0, -56), // homePos (kb. a molo mellett)
        new THREE.Vector3(5, 0, -94)
      ]);
      
      console.log('EoG Cinematic elindul - Ivevelt visszauti animacio...');
    }

    // ─── Mólón megjelenő kincsesláda (a cinematic csúcspontja) ───

      }, 2000);

    // ─── 🎵 Web Audio API Fanfár (szintetikus, fájl nélkül) ───
    function playEogFanfare() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        // Kalóz-fanfár hangsor: C-E-G-C arpeggio + záró akkord
        const melody = [
          { freq: 392.00, start: 0.00, dur: 0.18 }, // G4
          { freq: 523.25, start: 0.18, dur: 0.18 }, // C5
          { freq: 659.25, start: 0.36, dur: 0.18 }, // E5
          { freq: 783.99, start: 0.54, dur: 0.28 }, // G5
          { freq: 1046.5, start: 0.82, dur: 0.55 }, // C6 (záró magas)
          { freq: 523.25, start: 0.82, dur: 0.55 }, // C5 (záró mély)
          { freq: 659.25, start: 0.82, dur: 0.55 }, // E5 (záró közepes)
        ];
        melody.forEach(function(note) {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = note.freq;
          osc.type = 'triangle';
          const t0 = ctx.currentTime + note.start;
          gain.gain.setValueAtTime(0, t0);
          gain.gain.linearRampToValueAtTime(0.28, t0 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + note.dur);
          osc.start(t0);
          osc.stop(t0 + note.dur + 0.05);
        });
        console.log('🎵 EoG Fanfár lejátszva!');
      } catch(e) {
        console.warn('Web Audio fanfár hiba:', e);
      }
    }

    window.showInGameMonolog = function(startIndex, endIndex, onComplete) {
      // Ha már láttuk, ne mutassuk újra
      if (window.monologState.hasSeen[startIndex]) {
        // Ha már láttuk, de van callback, hívjuk meg azonnal (láncoláshoz)
        if (onComplete) onComplete();
        return;
      }
      window.monologState.hasSeen[startIndex] = true;
      window.monologState.onComplete = onComplete || null;
      
      window.monologState.currentBlockQueue = [];
      for (let i = startIndex; i <= endIndex; i++) {
        window.monologState.currentBlockQueue.push(i);
      }
      window.monologState.currentBlockIndex = 0;
      
      window.renderCurrentMonolog();
    };

    window.renderCurrentMonolog = function() {
      const container = document.getElementById('zozo-ingame-monolog-container');
      if (!container) return;
      
      if (window.monologState.currentBlockIndex < window.monologState.currentBlockQueue.length) {
        const monologIdx = window.monologState.currentBlockQueue[window.monologState.currentBlockIndex];
        document.getElementById('ingame-dialogue-text').innerText = window.gameMonologues[monologIdx];
        container.style.display = 'block';
      } else {
        // Vége a blokknak
        container.style.display = 'none';
        // Callback hívása a láncoláshoz
        if (window.monologState.onComplete) {
          const cb = window.monologState.onComplete;
          window.monologState.onComplete = null;
          cb();
        }
      }
    };

    window.advanceInGameMonolog = function() {
      window.monologState.currentBlockIndex++;
      window.renderCurrentMonolog();
    };

    // ─── LEADÁSKORI MONOLÓG TRIGGER RENDSZER (batch logikával) ───
    window.triggerDropoffMonologs = function(prevStored, newStored) {
      const blocks = [];

      // 1. hártya leadás: Popup 3 + Monológ 5-6
      if (prevStored < 1 && newStored >= 1) {
        blocks.push({ type: 'popup', msg: 'Nem rossz egy patkánytól!' });
        blocks.push({ start: 5, end: 6 });
      }
      // 2. hártya leadás: Monológ 7-8
      if (prevStored < 2 && newStored >= 2) {
        blocks.push({ start: 7, end: 8 });
      }
      // 3. hártya leadás: Monológ 9-12 (ha airship nem kapta el → hasSeen ellenőrzi)
      if (prevStored < 3 && newStored >= 3) {
        blocks.push({ start: 9, end: 12 });
      }
      // 4. hártya leadás: Monológ 13-19
      if (prevStored < 4 && newStored >= 4) {
        blocks.push({ start: 13, end: 19 });
      }
      // 5. hártya leadás: Monológ 20-30
      if (prevStored < 5 && newStored >= 5) {
        blocks.push({ start: 20, end: 30 });
      }

      // Láncolás: minden blokk végén elindul a következő
      function runNext(idx) {
        if (idx >= blocks.length) {
          // 🗨️ Popup 4: 1. leadás utáni kihajózáskor
          if (prevStored < 1 && newStored >= 1) {
            window._waitingForPierLeave = true;
          }
          return;
        }
        const block = blocks[idx];
        if (block.type === 'popup') {
          window.showPopUp(block.msg);
          setTimeout(function() { runNext(idx + 1); }, 600);
        } else {
          window.showInGameMonolog(block.start, block.end, function() {
            runNext(idx + 1);
          });
        }
      }

      if (blocks.length > 0) {
        runNext(0);
      }
    };

    window.selectZozoTextStep = function (stepVal) {
      const idx = parseInt(stepVal, 10);
      window.zozoTextStep = idx;
      const dialogText = document.getElementById('zozo-dialogue-text');
      if (dialogText) dialogText.innerText = window.zozoWelcomeTexts[idx];
      
      // Update body step class
      for(let i=0; i<100; i++) document.body.classList.remove('step-' + i);
      document.body.classList.add('step-' + idx);
    }

    window.advanceZozoWelcome = function () {
      const overlay = document.getElementById('zozo-welcome-overlay');
      if (!overlay || overlay.style.display === 'none') return;

      window.zozoTextStep++;
      if (window.zozoTextStep < window.zozoWelcomeTexts.length) {
        window.selectZozoTextStep(window.zozoTextStep);
      } else {
        window.closeZozoWelcome();
      }
    }

    window.closeZozoWelcome = function() {
      const overlay = document.getElementById('zozo-welcome-overlay');
      if (overlay) overlay.style.display = 'none';
      
      // Először a popup (WASD irányítás), aztán a monológ 1 a popup eltűnése után
      window.showPopUp("A WASD vagy az iránynyíl gombokkal a hajót, az egérrel a kamerát tudod irányítani.");
      setTimeout(function() {
        window.showInGameMonolog(1, 1);
      }, 4500);
    };

    window.showPopUp = function(msg) {
      const p = document.getElementById('ingame-popup-toast');
      if (p) {
        p.innerText = msg;
        p.style.display = 'block';
        setTimeout(() => { if (p.innerText === msg) p.style.display = 'none'; }, 4000);
      }
    };
