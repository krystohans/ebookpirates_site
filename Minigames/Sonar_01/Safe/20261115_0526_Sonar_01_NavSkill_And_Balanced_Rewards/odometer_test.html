<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>eBook Pirates - Odométer Teszt (Csúszósáv)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1114;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }
    .hud-wrapper {
      position: relative;
      width: 95vw;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background-image: url('assets/images/operating_desk.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    .odometer {
      position: absolute;
      top: 35.68%;
      height: 5.21%;
      width: 10.36%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      overflow: hidden;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    }
    #odometer-sorozat { left: 65.33%; }
    #odometer-navi    { left: 81.69%; }

    .digit-wheel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .digit-strip {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 1000%;
      transform: translateY(0%);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .digit-strip span {
      height: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: clamp(14px, 1.7vw, 28px);
      color: #dfd8c8;
      text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,0.8);
      user-select: none;
    }

    .test-controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      background: #1a2428;
      padding: 10px 18px;
      border: 1px solid #6b5335;
      border-radius: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .test-controls button {
      background: #8c6a3e;
      color: #fff;
      border: 1px solid #c9a46c;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
    .test-controls button:hover { background: #a8814d; }
  </style>
</head>
<body>
  <div class="hud-wrapper">
    <div class="odometer" id="odometer-sorozat"></div>
    <div class="odometer" id="odometer-navi"></div>
  </div>
  <div class="test-controls">
    <button onclick="addSorozat(1)">Sorozat +1</button>
    <button onclick="addSorozat(15)">Sorozat +15</button>
    <button onclick="addNavi(50)">Navi pont +50</button>
    <button onclick="addNavi(1375)">Navi pont +1375</button>
    <button onclick="resetCounters()">Nullázás</button>
  </div>
  <script>
    function initOdometer(containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const wheel = document.createElement('div');
        wheel.className = 'digit-wheel';
        const strip = document.createElement('div');
        strip.className = 'digit-strip';
        for (let num = 0; num <= 9; num++) {
          const span = document.createElement('span');
          span.textContent = num;
          strip.appendChild(span);
        }
        wheel.appendChild(strip);
        container.appendChild(wheel);
      }
    }

    function setOdometerValue(containerId, value) {
      const clamped = Math.max(0, Math.min(99999, Math.floor(value)));
      const digits = String(clamped).padStart(5, '0');
      const strips = document.querySelectorAll(`#${containerId} .digit-strip`);
      strips.forEach((strip, index) => {
        const targetDigit = parseInt(digits[index], 10);
        strip.style.transform = `translateY(-${targetDigit * 10}%)`;
      });
    }

    initOdometer('odometer-sorozat');
    initOdometer('odometer-navi');

    let currentSorozat = 0, currentNavi = 0;
    function addSorozat(amount) { currentSorozat += amount; setOdometerValue('odometer-sorozat', currentSorozat); }
    function addNavi(amount)    { currentNavi    += amount; setOdometerValue('odometer-navi',    currentNavi);    }
    function resetCounters() {
      currentSorozat = 0; currentNavi = 0;
      setOdometerValue('odometer-sorozat', 0);
      setOdometerValue('odometer-navi', 0);
    }
  </script>
</body>
</html>
