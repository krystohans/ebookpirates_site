<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SONAR_01 - Ködhasító Vezérlőpult</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cinzel, Share Tech Mono, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at 50% 40%, #1e3a5f 0%, #0d1b2a 60%, #050b11 100%);
    }

    .game-dimmed-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 9, 15, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
      pointer-events: none;
    }

    /* ─── HONLAP TOPBAR (Összecsukható) ─── */
    #portal-topbar-wrapper {
      position: relative;
      width: 100%;
      z-index: 50;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #portal-topbar-wrapper.collapsed {
      margin-top: -56px;
    }

    .portal-topbar {
      background: linear-gradient(180deg, #ffffff 0%, #f4f5f7 100%);
      color: #1e293b;
      border-bottom: 3px solid #b8860b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      font-family: 'Inter', sans-serif;
    }

    .topbar-toggle-handle {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #d4af37 0%, #8b6508 100%);
      border: 1px solid #ffd700;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 2px 18px 4px 18px;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      z-index: 60;
    }
    .topbar-toggle-handle:hover {
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      padding-bottom: 6px;
    } #btn-toggle-topbar { top: 100%; bottom: auto; width: 151px; height: 55px; padding: 0; border: none; border-radius: 0; box-shadow: none; background: url('assets/images/topbar_handle.png') center top / 100% 100% no-repeat; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.65)); } #btn-toggle-topbar:hover { background: url('assets/images/topbar_handle.png') center top / 100% 100% no-repeat; padding-bottom: 0; filter: brightness(1.15) drop-shadow(0 5px 10px rgba(0,0,0,0.75)); transform: translateX(-50%) translateY(2px); } #btn-toggle-topbar span { display: none; } #portal-topbar-wrapper.collapsed #btn-toggle-topbar, #portal-topbar-wrapper.collapsed #btn-toggle-topbar:hover { background-image: url('assets/images/topbar_handle_down.png'); }

    /* ─── KESKENY SÁRGARÉZ ABLAKKERET ─── */
    .brass-window-frame {
      position: relative;
      border: 2px solid #b8860b;
      outline: 1px solid #ffd700;
      outline-offset: -3px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.95),
        0 0 20px rgba(212, 175, 55, 0.35),
        inset 0 0 8px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
      overflow: hidden;
      background: #0a0e14;
      z-index: 20;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .brass-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: #ffe082;
      pointer-events: none;
      z-index: 30;
    }
    .corner-tl { top: 2px; left: 2px; border-top: 2px solid #ffd700; border-left: 2px solid #ffd700; }
    .corner-tr { top: 2px; right: 2px; border-top: 2px solid #ffd700; border-right: 2px solid #ffd700; }
    .corner-bl { bottom: 2px; left: 2px; border-bottom: 2px solid #ffd700; border-left: 2px solid #ffd700; }
    .corner-br { bottom: 2px; right: 2px; border-bottom: 2px solid #ffd700; border-right: 2px solid #ffd700; }

    .brass-close-btn {
      background: linear-gradient(180deg, #875718 0%, #4a2c07 100%);
      border: 1px solid #ffd700;
      color: #fff2cc;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
    }
    .brass-close-btn:hover {
      background: linear-gradient(180deg, #b37722 0%, #683e0a 100%);
      color: #ffffff;
      transform: scale(1.05);
    }

    /* Steampunk Gomb Animáció */
    .steampunk-btn-img {
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .steampunk-btn-img:hover {
      transform: scale(1.04) translateY(-1px);
      filter: drop-shadow(0 6px 12px rgba(255,215,0,0.3));
    }
    .steampunk-btn-img:active {
      transform: scale(0.97) translateY(1px);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.9));
    }

    /* Csúszósávos odometer */
    .odometer {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      overflow: hidden;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
    }
    .digit-wheel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .digit-strip {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 1000%;
      transform: translateY(0%);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .digit-strip span {
      height: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: clamp(10px, 1.4vw, 24px);
      color: #dfd8c8;
      text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,0.8);
      user-select: none;
    } .digit-wheel:last-child .digit-strip span { color: #111; text-shadow: 0 1px 0 rgba(255,255,255,0.45); }
    /* ===== EGYEDI KURZOR (egész asztal) ===== */
    #operating-window { cursor: url('assets/images/pointer.png') 21 0, default; } #switch-an, #switch-info { cursor: url('assets/images/grab.png') 7 15, grab; } #switch-an:active, #switch-info:active { cursor: url('assets/images/grabbing.png') 6 11, grabbing; } img, canvas, #operating-window { -webkit-user-drag: none; user-drag: none; user-select: none; -webkit-user-select: none; }
    /* ===== ABAKUSZ ===== */
    .abacus-container {
      position: absolute;
      left: 65.5%;
      top: 6.0%;
      width: 27.6%;
      height: 22.8%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .abacus-row {
      position: relative;
      width: 100%;
      height: 24%;
    }
    .abacus-bead {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      aspect-ratio: 0.82 / 1;
      border-radius: 50%;
      cursor: url('assets/images/grab.png') 7 15, grab;
      background: center / 100% 100% no-repeat;
      box-shadow: -2px 4px 6px rgba(0,0,0,0.85), inset 0 0 3px rgba(255,230,150,0.6);
      transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1), filter 0.15s;
      touch-action: none;
    }
    .abacus-bead:hover { filter: brightness(1.15); }
    .abacus-bead:active { cursor: url('assets/images/grabbing.png') 6 11, grabbing; }
    .abacus-row[data-row="0"] .abacus-bead { height: 72%; background-image: url('assets/images/abacus_bead_0.png'); }
    .abacus-row[data-row="1"] .abacus-bead { height: 84%; background-image: url('assets/images/abacus_bead_1.png'); }
    .abacus-row[data-row="2"] .abacus-bead { height: 96%; background-image: url('assets/images/abacus_bead_2.png'); }
    .abacus-row[data-row="3"] .abacus-bead { height: 112%; background-image: url('assets/images/abacus_bead_3.png'); }
    .mode-led {
      width: 34.5%;
      height: 48%;
      top: 14%;
      border-radius: 50%;
      animation: modePulse 1.8s infinite alternate ease-in-out;
    }
    .mode-led-sonar {
      box-shadow: 0 0 12px 3px #00e5ff, inset 0 0 8px 2px #00e5ff;
      border: 1.5px solid #00e5ff;
    }
    .mode-led-map {
      box-shadow: 0 0 12px 3px #ff5722, inset 0 0 8px 2px #ff5722;
      border: 1.5px solid #ff5722;
    }
    .mode-led-route {
      box-shadow: 0 0 12px 3px #ffcc00, inset 0 0 8px 2px #ffcc00;
      border: 1.5px solid #ffcc00;
    }
    .mode-led-start {
      box-shadow: 0 0 12px 3px #39ff14, inset 0 0 8px 2px #39ff14;
      border: 1.5px solid #39ff14;
    }
    @keyframes modePulse {
      0% { opacity: 0.65; transform: scale(0.96); }
      100% { opacity: 1.0; transform: scale(1.04); }
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative overflow-hidden">

  <!-- 1. HÁTTÉR: A főjáték elhalványított környezete -->
  <div class="game-dimmed-backdrop"></div>

  <!-- 2. HONLAP TOPBAR PLACEHOLDER (Összecsukható) -->
  <div id="portal-topbar-wrapper" class="flex-shrink-0">
    <header class="portal-topbar w-full h-14 px-6 flex items-center justify-between relative">
      <div class="flex items-center gap-3">
        <span class="font-brass text-lg font-bold text-amber-900 tracking-wider">eBookPirates</span>
        <span class="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold border border-amber-300">Portál Fejléc</span>
      </div>

      <div class="flex items-center gap-6 text-sm font-semibold text-slate-700">
        <div class="flex items-center gap-2 bg-amber-50 px-3 py-1 rounded-full border border-amber-300 shadow-sm">
          <span class="text-amber-600">🪙</span>
          <span class="font-mono text-slate-900 font-bold">9,764</span>
        </div>
        <div class="flex items-center gap-1.5 hover:text-amber-700 cursor-pointer">
          <span>📖</span>
          <span>Könyvtár</span>
        </div>
        <div class="flex items-center gap-1.5 hover:text-amber-700 cursor-pointer">
          <span>💎</span>
          <span>Kincsek</span>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1 text-base">
          <span title="Magyar" class="cursor-pointer hover:scale-110 transition-transform">🇭🇺</span>
          <span title="English" class="cursor-pointer hover:scale-110 transition-transform">🇬🇧</span>
          <span title="Deutsch" class="cursor-pointer hover:scale-110 transition-transform">🇩🇪</span>
          <span title="Français" class="cursor-pointer hover:scale-110 transition-transform">🇫🇷</span>
          <span title="Español" class="cursor-pointer hover:scale-110 transition-transform">🇪🇸</span>
        </div>
        <button class="text-slate-500 hover:text-red-600 font-bold text-base px-2 py-1 cursor-pointer" title="Vissza a kikötőbe">
          ✕
        </button>
      </div>
    </header>

    <button id="btn-toggle-topbar" class="topbar-toggle-handle" title="Fejléc elrejtése / megjelenítése">
      <span id="topbar-arrow">▲</span>
      <span id="topbar-text" class="text-[10px] tracking-wider uppercase">TopBar</span>
    </button>
  </div>

  <!-- 3. KÖZPONTI TÉR: Keskeny sárgaréz Operating Desk ablak -->
  <main class="flex-1 w-full flex items-center justify-center p-3 relative z-20 overflow-hidden">
    
    <div id="operating-window" class="brass-window-frame aspect-[16/9] max-h-full max-w-full flex flex-col relative" style="height: calc(100vh - 85px);">
      
      <div class="brass-corner corner-tl"></div>
      <div class="brass-corner corner-tr"></div>
      <div class="brass-corner corner-bl"></div>
      <div class="brass-corner corner-br"></div>

      <!-- Bezárás gomb -->
      <div class="absolute top-2 right-2 z-40 hidden">
        <button class="brass-close-btn px-2.5 py-0.5 rounded text-xs font-bold cursor-pointer" title="Minijáték bezárása">
          ✕
        </button>
      </div>

      <!-- Pult Főképe -->
      <div class="w-full h-full relative overflow-hidden flex items-center justify-center bg-[#070c10]">
        <img 
          src="assets/images/operating_desk_abacus_clean.jpg" 
          alt="Operating Desk" 
          class="w-full h-full object-cover select-none pointer-events-none"
        />

        <!-- ============================================================== -->
        <!-- 📟 BAL OLDAL: CRT KÉPERNYŐ (100% ÁTLÁTSZÓ, fotó eredeti hálójával) -->
        <!-- ============================================================== -->
        <div class="absolute overflow-visible cursor-crosshair"
             style="left: 4.8%; top: 17.11%; width: 46.8%; height: 78.8%;">
          
          <img src="assets/images/compass-black-background.png" alt="" class="absolute w-[68%] h-[68%] object-contain pointer-events-none" style="left: 45.6%; top: 50%; transform: translate(-50%, -50%); opacity: 0.14; filter: grayscale(100%) sepia(40%) hue-rotate(95deg) brightness(90%);" /><canvas id="let-crt-canvas" class="w-full h-full block bg-transparent relative z-10"></canvas>

          <!-- Autentikus Steampunk Útvonaltervezés & START Gombok -->
          <div id="screen-nav-bar" style="display: none;" class="absolute -top-12 left-1/2 -translate-x-1/2 hidden items-center gap-3 z-30 pointer-events-auto">
            <!-- ÚTVONALTERVEZŐ Gomb -->
            <button id="btn-screen-route" class="h-9 cursor-pointer focus:outline-none transition-transform hover:scale-105 active:scale-95" title="Útvonaltervezés aktiválása">
              <img src="assets/images/btn_route_plate.png" alt="Útvonaltervezés" class="h-full object-contain filter drop-shadow-md" />
            </button>

            <!-- START Gomb -->
            <button id="btn-screen-start" class="h-9 cursor-pointer focus:outline-none transition-transform hover:scale-105 active:scale-95 hidden" title="Hajó Indítása">
              <img src="assets/images/btn_start_plate.png" alt="Start" class="h-full object-contain filter drop-shadow-md" />
            </button>
          </div>

          <!-- Automata Navigáció (AN) Átváltás Figyelmeztetés -->
          <div id="an-prompt-overlay" class="absolute bg-[#040b07]/[0.96] pb-[150px] hidden flex-col items-center justify-center p-6 z-40 text-center" style="left:-3.2%;right:3.2%;top:-1.6%;bottom:-0.8%;">
            <h3 class="text-amber-500 font-mono text-[18px] font-bold tracking-widest mb-6">
              ÁTADOD AZ IRÁNYÍTÁST AZ AN RENDSZERNEK?
            </h3>
            <p class="text-[11px] text-[#39ff14] font-mono mb-8">
              (Az Automata Navigáció átjuttatja a hajót, de 0 Navi Pontot és 0 Hártyát kapsz!)
            </p>
            <div class="flex gap-4">
              <button id="btn-an-yes" class="px-5 py-1.5 bg-[#0a2e16] hover:bg-[#114522] text-[#bfffab] font-bold text-xs rounded border border-[#39ff14]/70 hover:border-[#ffd700] hover:shadow-[0_0_14px_rgba(255,215,0,0.85)] transition-all duration-150 cursor-pointer">
                IGEN (Átadás)
              </button>
              <button id="btn-an-no" class="px-5 py-1.5 bg-[#0a2e16] hover:bg-[#114522] text-[#bfffab] font-bold text-xs rounded border border-[#39ff14]/70 hover:border-[#ffd700] hover:shadow-[0_0_14px_rgba(255,215,0,0.85)] transition-all duration-150 cursor-pointer">
                NEM (Kézi vezérlés)
              </button>
            </div>
          </div>
                </div>

        <!-- ============================================================== -->
        <!-- 🔘 FELSŐ RÉZ KERET: 4-GOMBOS MÓDVÁLASZTÓ PANEL (Szonár, Térkép, Útvonal, Start) -->
        <!-- ============================================================== -->
        <div id="mode-panel" class="absolute flex items-center justify-between z-30 pointer-events-auto"
             style="left: 5.21%; top: 0.10%; width: 40.43%; height: 12.75%;">
          <!-- SZONÁR -->
          <button id="btn-mode-sonar" class="relative w-1/4 h-full cursor-pointer focus:outline-none flex items-center justify-center" title="Szonár Mód">
            <span class="mode-led mode-led-sonar absolute rounded-full pointer-events-none"></span>
          </button>
          <!-- TÉRKÉP -->
          <button id="btn-mode-map" class="relative w-1/4 h-full cursor-pointer focus:outline-none flex items-center justify-center" title="Térkép Mód (X-szel jelölés)">
            <span class="mode-led mode-led-map absolute rounded-full pointer-events-none hidden"></span>
          </button>
          <!-- ÚTVONAL -->
          <button id="btn-mode-route" class="relative w-1/4 h-full cursor-pointer focus:outline-none flex items-center justify-center" title="Útvonaltervezés Mód">
            <span class="mode-led mode-led-route absolute rounded-full pointer-events-none hidden"></span>
          </button>
          <!-- START -->
          <button id="btn-mode-start" class="relative w-1/4 h-full cursor-pointer focus:outline-none flex items-center justify-center" title="Hajó Indítása">
            <span class="mode-led mode-led-start absolute rounded-full pointer-events-none hidden"></span>
          </button>
        </div>

<!-- 🧮 JOBB FELSŐ SZEKCIÓ: ABAKUSZ (Közvetlenül a fotó abakuszára illesztve) -->
        <!-- ============================================================== -->
        <div class="abacus-container" id="abacus">
          <div class="abacus-row" data-row="0"></div>
          <div class="abacus-row" data-row="1"></div>
          <div class="abacus-row" data-row="2"></div>
          <div class="abacus-row" data-row="3"></div>
        </div>

        <!-- ============================================================== -->
        <!-- 🪙 JOBB KÖZÉP: MECHANIKUS ODOMETER SZÁMLÁLÓK ("Sorozat" & "Navi pont") -->
        <!-- ============================================================== -->
        <!-- Sorozat csúszósávos odometer -->
        <div class="odometer" id="odometer-sorozat"
             style="left:65.33%; top:35.68%; width:10.36%; height:5.21%;"></div>

        <!-- Navi pont csúszósávos odometer -->
        <div class="odometer" id="odometer-navi"
             style="left:81.69%; top:35.68%; width:10.36%; height:5.21%;"></div>

        <!-- ============================================================== -->
        <!-- 🧭 JOBB KÖZÉP-LENT: SZONÁR & SZERKEZET MUTATÓK (Pixelpontosan az órákra) -->
        <!-- ============================================================== -->
        <div class="absolute pointer-events-none"
             style="left: 61.74%; top: 47.79%; width: 8.07%; height: 14.45%;">
          <canvas id="gauge-sonar-canvas" class="w-full h-full block bg-transparent"></canvas>
        </div>

        <div class="absolute pointer-events-none"
             style="left: 72.20%; top: 47.79%; width: 8.07%; height: 14.45%;">
          <canvas id="gauge-hull-canvas" class="w-full h-full block bg-transparent"></canvas>
        </div>

        <!-- ============================================================== -->
        <!-- 🎛️ JOBB ALSÓ: FÉM BILLENŐKAPCSOLÓK ("AN" & "INFO" fotóra illesztve) -->
        <!-- ============================================================== -->
        <div class="absolute cursor-pointer" style="left: 62.27%; top: 75.35%; width: 4.88%; height: 14.45%;" title="Automata Navigáció (AN) Kapcsoló">
          <div id="switch-an" class="w-full h-full relative">
            <img id="img-switch-an-down" src="assets/images/switch_an_down_fit.png" alt="AN Down" class="w-full h-full object-contain" />
          </div>
        </div>

        <div class="absolute cursor-pointer" style="left: 69.91%; top: 75.35%; width: 4.88%; height: 14.45%;" title="Információ / Szabályzat Kapcsoló">
          <div id="switch-info" class="w-full h-full relative">
            <img id="img-switch-info-down" src="assets/images/switch_info_down_fit.png" alt="Info Down" class="w-full h-full object-contain" />
          </div>
        </div>

        <!-- ============================================================== -->
        <!-- 📡 JOBB ALUL: KÉK KÖR ALAKÚ RADAR & HANGHULLÁM KIJELZŐ -->
        <!-- ============================================================== -->
        <div class="absolute rounded-full overflow-hidden pointer-events-none"
             style="left: 78.32%; top: 67.25%; width: 18.5%; height: 28.0%;">
          <canvas id="radar-scope-canvas" class="w-full h-full block bg-transparent"></canvas>

  <!-- MODULÁRIS SCRIPT BETÖLTÉSEK -->
  <script src="config.js"></script>
  <script src="oscilloscope.js"></script>
  <script src="let_particles.js"></script>
  <script src="gameplay.js"></script>
  <script src="gauges.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('dragstart', e => e.preventDefault());
      // 1. TopBar toggle
      const topbarWrapper = document.getElementById('portal-topbar-wrapper');
      const toggleBtn = document.getElementById('btn-toggle-topbar');
      const arrowSpan = document.getElementById('topbar-arrow');
      const operatingWindow = document.getElementById('operating-window');
      let isTopBarOpen = true;

      toggleBtn.addEventListener('click', () => {
        isTopBarOpen = !isTopBarOpen;
        if (isTopBarOpen) {
          topbarWrapper.classList.remove('collapsed');
          arrowSpan.textContent = '▲';
          operatingWindow.style.height = 'calc(100vh - 85px)';
        } else {
          topbarWrapper.classList.add('collapsed');
          arrowSpan.textContent = '▼';
          operatingWindow.style.height = 'calc(100vh - 35px)';
        }
        setTimeout(() => {
          window.SonarLetParticles.resize();
          window.SonarOscilloscope.resize();
          window.SonarGauges.init();
        }, 360);
      });

      // 2. Modulok inicializálása
      window.SonarLetParticles.init('let-crt-canvas');
      window.SonarOscilloscope.init('radar-scope-canvas');
      window.SonarGauges.init();

      // 3a. Csúszósávos odometer init
      function initOdometer(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        for (let i = 0; i < 5; i++) {
          const wheel = document.createElement('div');
          wheel.className = 'digit-wheel';
          const strip = document.createElement('div');
          strip.className = 'digit-strip';
          for (let num = 0; num <= 9; num++) {
            const span = document.createElement('span');
            span.textContent = num;
            strip.appendChild(span);
          }
          wheel.appendChild(strip);
          container.appendChild(wheel);
        }
      }
      window.setOdometerValue = function(containerId, value) {
        const clamped = Math.max(0, Math.min(99999, Math.floor(value)));
        const digits = String(clamped).padStart(5, '0');
        const strips = document.querySelectorAll(`#${containerId} .digit-strip`);
        strips.forEach((strip, index) => {
          strip.style.transform = `translateY(-${parseInt(digits[index], 10) * 10}%)`;
        });
      };
      initOdometer('odometer-sorozat');
      initOdometer('odometer-navi');
      window.setOdometerValue('odometer-sorozat', 0);
      window.setOdometerValue('odometer-navi', 0);

      // 3b. Abakusz (8, 6, 4, 2 golyó, húzható/kattintható)
      const rowConfigs = [
        { count: 8, widthPct: 5.2 },
        { count: 6, widthPct: 6.0 },
        { count: 4, widthPct: 7.0 },
        { count: 2, widthPct: 8.2 }
      ];
      const abacusState = rowConfigs.map(cfg => Array(cfg.count).fill(false));

      function layoutRow(rIdx) {
        const rowEl = document.querySelector(`.abacus-row[data-row="${rIdx}"]`);
        const beads = rowEl.querySelectorAll('.abacus-bead');
        const { count, widthPct } = rowConfigs[rIdx];
        beads.forEach((bead, bIdx) => {
          const leftPct = abacusState[rIdx][bIdx]
            ? 100 - ((count - bIdx) * widthPct)
            : bIdx * widthPct;
          bead.style.left = `${leftPct}%`;
        });
      }

      function setBeadSide(rIdx, bIdx, moveToRight) {
        const states = abacusState[rIdx];
        if (moveToRight) { for (let i = bIdx; i < states.length; i++) states[i] = true; }
        else { for (let i = 0; i <= bIdx; i++) states[i] = false; }
        layoutRow(rIdx);
      }

      function setupBeadInteraction(bead, rowEl, rIdx, bIdx) {
        let startX = 0, startLeftPct = 0, moved = false;
        bead.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          bead.setPointerCapture(e.pointerId);
          startX = e.clientX;
          startLeftPct = parseFloat(bead.style.left) || 0;
          moved = false;
          bead.style.transition = 'none';
        });
        bead.addEventListener('pointermove', (e) => {
          if (!bead.hasPointerCapture(e.pointerId)) return;
          const dx = e.clientX - startX;
          if (Math.abs(dx) > 4) moved = true;
          const deltaPct = (dx / rowEl.getBoundingClientRect().width) * 100;
          const { count, widthPct } = rowConfigs[rIdx];
          const minLeft = bIdx * widthPct;
          const maxLeft = 100 - ((count - bIdx) * widthPct);
          bead.style.left = `${Math.max(minLeft, Math.min(maxLeft, startLeftPct + deltaPct))}%`;
        });
        bead.addEventListener('pointerup', (e) => {
          if (!bead.hasPointerCapture(e.pointerId)) return;
          bead.releasePointerCapture(e.pointerId);
          bead.style.transition = 'left 0.28s cubic-bezier(0.22, 1, 0.36, 1), filter 0.15s';
          if (!moved) {
            setBeadSide(rIdx, bIdx, !abacusState[rIdx][bIdx]);
          } else {
            const { count, widthPct } = rowConfigs[rIdx];
            const minLeft = bIdx * widthPct;
            const maxLeft = 100 - ((count - bIdx) * widthPct);
            setBeadSide(rIdx, bIdx, parseFloat(bead.style.left) >= (minLeft + maxLeft) / 2);
          }
        });
      }

      document.querySelectorAll('.abacus-row').forEach((rowEl, rIdx) => {
        rowEl.innerHTML = '';
        const { count, widthPct } = rowConfigs[rIdx];
        for (let bIdx = 0; bIdx < count; bIdx++) {
          const bead = document.createElement('div');
          bead.className = 'abacus-bead';
          bead.style.width = `${widthPct}%`;
          setupBeadInteraction(bead, rowEl, rIdx, bIdx);
          rowEl.appendChild(bead);
        }
        layoutRow(rIdx);
      });
      window.getAbacusCounts = () => abacusState.map(row => row.filter(Boolean).length);
      window.resetAbacus = () => abacusState.forEach((row, rIdx) => { row.fill(false); layoutRow(rIdx); });

      // 3. TŰÉLES CRT HAJÓNAPLÓ SZÖVEG
      const reason = window.SonarConfig.WEATHER_REASONS[Math.floor(Math.random() * window.SonarConfig.WEATHER_REASONS.length)];
      
      const rc = (window.SonarEngine && window.SonarEngine.state && window.SonarEngine.state.rockCounts) || { small: 4, medium: 2, large: 1, wreck: 0 };
      const obsLines = [
        ` • ${rc.small} db 1 egység (Kicsi zátony)`,
        ` • ${rc.medium} db 2 egység (Kettős szikla)`,
        ` • ${rc.large} db 3 egység (Óriás fal)`
      ];
      if (rc.wreck > 0) obsLines.push(` • ${rc.wreck} db 4 egység (Hajóroncs)`);

      const briefingLines = [
        "HAJÓNAPLÓ JELENTÉS:",
        reason,
        "",
        "A szektorban prognosztizált akadályok:",
        ...obsLines,
        "A bal szél bármelyik mezőjén átjutva nyersz – az ikon sorában extra bónuszt is szerzel.",
        "",
        "[Kattints a képernyőre a háló azonnali aktiválásához]"
      ];

      window.SonarLetParticles.setText(briefingLines, 30, () => {
        console.log("Morfolódás kész, tengeri háló aktív!");
        document.getElementById('screen-nav-bar').classList.remove('hidden');
        document.getElementById('screen-nav-bar').classList.add('flex');
      });

      // 4. Módválasztó rendszer (SZONÁR, TÉRKÉP, ÚTVONAL, START)
      let currentMode = 'SONAR';
      const modes = ['sonar', 'map', 'route', 'start'];
      function setGameMode(mode) {
        currentMode = mode.toUpperCase();
        modes.forEach(m => {
          const led = document.querySelector(`.mode-led-${m}`);
          if (led) {
            if (m === mode.toLowerCase() && !(m === 'sonar' && window.SonarEngine && window.SonarEngine.state && window.SonarEngine.state.pingsCur <= 0)) {
              led.classList.remove('hidden');
            } else {
              led.classList.add('hidden');
            }
          }
        });
        if (window.SonarLetParticles && window.SonarLetParticles.setMode) {
          window.SonarLetParticles.setMode(currentMode);
        }
        console.log("Aktív játékmód:", currentMode);
      }

      document.getElementById('btn-mode-sonar').addEventListener('click', () => setGameMode('sonar'));
      document.getElementById('btn-mode-map').addEventListener('click', () => setGameMode('map'));
      document.getElementById('btn-mode-route').addEventListener('click', () => setGameMode('route'));
      document.getElementById('btn-mode-start').addEventListener('click', () => setGameMode('start'));

      // 4. Útvonaltervezés & START gombok
      const btnRoute = document.getElementById('btn-screen-route');
      const btnStart = document.getElementById('btn-screen-start');
      btnRoute.addEventListener('click', () => {
        btnStart.classList.remove('hidden');
        btnStart.classList.add('inline-flex');
      });

      // 5. CRT kattintás: szonár hullám a képernyőn + AKUSZTIKUS HULLÁM A KÖR RADARON!
      const crtCanvas = document.getElementById('let-crt-canvas');
      crtCanvas.addEventListener('click', (e) => {
        if (window.SonarLetParticles.getState() === 'GRID') {
          const isRockHit = Math.random() < 0.35;
          window.SonarLetParticles.triggerSonarWave(3, 3);
          window.SonarOscilloscope.triggerPing(isRockHit);
        }
      });

      // 5. "AN" és "Info" kapcsolók
      const switchAn = document.getElementById('switch-an');
      const imgAnDown = document.getElementById('img-switch-an-down');
      const anOverlay = document.getElementById('an-prompt-overlay');

      switchAn.addEventListener('click', () => {
        const crtEl = document.getElementById('let-crt-canvas');
        const isCurrentlyDown = !imgAnDown.classList.contains('hidden');
        if (isCurrentlyDown) {
          imgAnDown.classList.add('hidden');
          anOverlay.classList.remove('hidden');
          anOverlay.classList.add('flex');
          if (crtEl) crtEl.classList.add('invisible');
        } else {
          imgAnDown.classList.remove('hidden');
          anOverlay.classList.add('hidden');
          anOverlay.classList.remove('flex');
          if (crtEl) crtEl.classList.remove('invisible');
        }
      });

      document.getElementById('btn-an-yes').addEventListener('click', () => {
        const crtEl = document.getElementById('let-crt-canvas');
        anOverlay.classList.add('hidden');
        anOverlay.classList.remove('flex');
        if (crtEl) crtEl.classList.remove('invisible');
        if (window.SonarLetParticles && window.SonarLetParticles.triggerAutoNav) {
          window.SonarLetParticles.triggerAutoNav();
        }
      });

      document.getElementById('btn-an-no').addEventListener('click', () => {
        const crtEl = document.getElementById('let-crt-canvas');
        imgAnDown.classList.remove('hidden');
        anOverlay.classList.add('hidden');
        anOverlay.classList.remove('flex');
        if (crtEl) crtEl.classList.remove('invisible');
      });

      // 6. Végjáték & Hajónapló bejegyzés + terkeputazas01.mp4 + jutalom mentés
      window.onSonarGameEnd = function(res) {
        if (!res) return;
        if (window.SonarEngine && window.SonarEngine.markSonarPlayed) window.SonarEngine.markSonarPlayed();
        const crtEl = document.getElementById('let-crt-canvas');
        const parentEl = crtEl ? crtEl.parentElement : null;
        if (!parentEl) return;

        try {
          localStorage.setItem('ebook_pirates_ship_hp', String(res.hp));
          if (res.status === 'WIN') {
            const prev = JSON.parse(localStorage.getItem('ebook_pirates_sonar_rewards') || '{"navPoints":0,"credits":0,"hartya":0,"elelem":0,"rum":0}');
            prev.navPoints += (res.navPoints || 0);
            prev.credits += (res.extraReward && res.extraReward.type === 'CHEST' ? res.extraReward.amount : 0);
            prev.hartya += (res.extraReward && res.extraReward.type === 'BARREL' ? res.extraReward.amount : 0);
            if (res.extraReward && res.extraReward.type === 'BOTTLE') {
              if (res.extraReward.subType === 'rum') prev.rum += 1;
              else prev.elelem += 1;
            }
            localStorage.setItem('ebook_pirates_sonar_rewards', JSON.stringify(prev));
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'sonar-minigame', ...res }, '*');
          }
        } catch (e) {}

        let box = document.getElementById('crt-result-overlay');
        if (!box) {
          box = document.createElement('div');
          box.id = 'crt-result-overlay';
          box.className = 'absolute bg-[#040b07]/[0.96] text-[#39ff14] font-mono text-[14px] px-6 py-5 flex flex-col justify-between z-40 pointer-events-auto leading-relaxed';
          box.style.cssText = 'left:-3.2%;right:3.2%;top:-1.6%;bottom:-0.8%;text-shadow:0 0 6px rgba(57,255,20,0.45);';
          parentEl.appendChild(box);
        }

        if (res.status === 'TOWED') {
          const curLang = window.currentLanguage || localStorage.getItem('ebook_pirates_language') || localStorage.getItem('siteLang') || 'hu';
          const towDict = {
            hu: 'A csónak nem bír ki még egy ütközést.\n\nHolzkopf mester most elvontat Hebokba.',
            en: 'The boat cannot withstand another collision.\n\nMaster Holzkopf is now towing you to Hebok.',
            de: 'Das Boot hält keinen weiteren Zusammenstoß aus.\n\nMeister Holzkopf schleppt dich jetzt nach Hebok ab.',
            fr: 'La barque ne supportera pas une autre collision.\n\nMaître Holzkopf vous remorque maintenant jusqu\'à Hebok.',
            es: 'La barca no resistirá otra colisión.\n\nEl maestro Holzkopf te remolca ahora a Hebok.',
            pl: 'Łódź nie wytrzyma kolejnego zderzenia.\n\nMistrz Holzkopf odholowuje cię teraz do Hebok.',
            ru: 'Лодка не выдержит еще одного столкновения.\n\nМастер Хольцкопф буксирует вас в Хебок.'
          };
          const msg = (towDict[curLang] || towDict.hu).replace(/\n\n/g, '<br><br>');
          box.innerHTML = `<div class="border-b border-[#39ff14]/40 pb-2 text-base font-bold tracking-widest text-[#ff5555]">HAJÓNAPLÓ BEJEGYZÉS</div><div class="my-auto text-center text-[#bfffab] text-[15px]">${msg}</div><div class="text-center text-xs opacity-75 border-t border-[#39ff14]/30 pt-2">[Kattints vagy várj a vontatásra...]</div>`;
          box.classList.remove('hidden');
          crtEl.classList.add('invisible');

          let launched = false;
          const startTowVideo = () => {
            if (launched) return;
            launched = true;
            box.classList.add('hidden');
            crtEl.classList.remove('invisible');
            let vWrap = document.getElementById('sonar-departure-video-overlay');
            if (!vWrap) {
              vWrap = document.createElement('div');
              vWrap.id = 'sonar-departure-video-overlay';
              vWrap.style.cssText = 'position:fixed;inset:0;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
              vWrap.innerHTML = '<video id="sonar-departure-video" preload="auto" playsinline style="width:100%;height:100%;object-fit:contain;" src="https://storage.googleapis.com/kalozsziget-assets/videos/terkeputazas01.mp4"></video>';
              document.body.appendChild(vWrap);
            }
            const vid = document.getElementById('sonar-departure-video');
            vWrap.style.display = 'flex';
            vid.currentTime = 0;
            vid.play().catch(() => {});
            const finishVid = () => {
              vWrap.style.display = 'none';
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ source: 'sonar-minigame', status: 'EXIT_TO_PORT', targetPage: 'hajomuhely_oldal', hp: res.hp, maxHp: res.maxHp }, '*');
              }
            };
            vid.onended = finishVid;
            vWrap.onclick = finishVid;
          };
          box.onclick = startTowVideo;
          setTimeout(startTowVideo, 4000);
          return;
        }

        // WIN
        const rows = [`<li>• <b>+${res.navPoints} Navi pont</b></li>`];
        if (res.extraReward) rows.push(`<li>• <b>${res.extraReward.label}</b></li>`);
        box.innerHTML = `
          <div class="border-b border-[#39ff14]/40 pb-2 text-base font-bold tracking-widest text-[#8aff70]">HAJÓNAPLÓ BEJEGYZÉS</div>
          <div class="my-auto pb-[150px]">
            <div class="text-xl font-bold text-[#bfffab] mb-6">Átjutottál!</div>
            <div class="text-xs uppercase tracking-wider text-[#8aff70] mb-3">Megszerzett jutalmak:</div>
            <ul class="space-y-1 text-[14px] text-[#ff9933]">${rows.join('')}</ul>
          </div>
          <div class="flex justify-center gap-3 border-t border-[#39ff14]/30 pt-3">
            <button id="btn-sonar-next-sector" class="px-4 py-1.5 bg-[#39ff14]/20 hover:bg-[#39ff14]/35 border border-[#39ff14] hover:border-[#ffd700] hover:shadow-[0_0_14px_rgba(255,215,0,0.85)] transition-all duration-150 text-[#bfffab] font-bold text-xs tracking-wider cursor-pointer">TOVÁBB</button>
          </div>
        `;
        box.classList.remove('hidden');
        crtEl.classList.add('invisible');
        const nextBtn = document.getElementById('btn-sonar-next-sector');
        if (nextBtn) nextBtn.onclick = () => { box.classList.add('hidden'); crtEl.classList.remove('invisible'); };
      };

      window.onSonarOutOfPings = function () {
        const sonarLed = document.querySelector('.mode-led-sonar');
        if (sonarLed) sonarLed.classList.add('hidden');
        setTimeout(() => {
          const crtEl = document.getElementById('let-crt-canvas');
          const parentEl = crtEl && crtEl.parentElement;
          if (!parentEl) return;
          let box = document.getElementById('crt-result-overlay');
          if (!box) {
            box = document.createElement('div');
            box.id = 'crt-result-overlay';
            box.className = 'absolute bg-[#040b07]/[0.96] text-[#39ff14] font-mono text-[14px] px-6 py-5 flex flex-col justify-between z-40 pointer-events-auto leading-relaxed';
            box.style.cssText = 'left:-3.2%;right:3.2%;top:-1.6%;bottom:-0.8%;text-shadow:0 0 6px rgba(57,255,20,0.45);';
            parentEl.appendChild(box);
          }
          box.innerHTML = `<div class="border-b border-[#39ff14]/40 pb-2 text-base font-bold tracking-widest text-[#8aff70]">HAJÓNAPLÓ BEJEGYZÉS</div><div class="my-auto pb-[150px] text-center text-[#bfffab] text-[15px]">Nincs több Szonár jel indítási lehetőséged.<br><br>Tervezd meg az útvonalt, vagy add át az AutoNavigációnak az irányítást!</div><div class="text-center text-xs opacity-75 border-t border-[#39ff14]/30 pt-2 cursor-pointer">[Kattints ide a folytatáshoz]</div>`;
          box.classList.remove('hidden');
          crtEl.classList.add('invisible');
          box.onclick = () => { box.classList.add('hidden'); crtEl.classList.remove('invisible'); };
        }, 1600);
      };

      const switchInfo = document.getElementById('switch-info');
      const imgInfoDown = document.getElementById('img-switch-info-down');
      switchInfo.addEventListener('click', () => {
        const isUp = imgInfoDown.classList.toggle('hidden'); const crtEl = document.getElementById('let-crt-canvas'); crtEl.classList.toggle('invisible', isUp); let box = document.getElementById('crt-info-overlay'); if (!box) { box = document.createElement('div'); box.id = 'crt-info-overlay'; box.className = 'absolute bg-[#040b07]/[0.97] text-[#39ff14] font-mono text-[13.5px] px-5 py-3.5 flex flex-col justify-between z-30 pointer-events-auto leading-snug'; box.style.cssText = 'left:-3.2%;right:3.2%;top:-1.6%;bottom:-0.8%;text-shadow:0 0 6px rgba(57,255,20,0.45);'; box.innerHTML = '<div class="overflow-y-auto pr-2 flex-1" style="scrollbar-width:thin;scrollbar-color:#39ff14 #040b07;"><div class="text-base font-bold tracking-widest border-b border-[#39ff14]/40 pb-1 mb-1 text-[#8aff70]">SZONÁR – KEZELÉSI ÚTMUTATÓ</div><div class="mt-[6px] font-bold underline tracking-wider text-[#8aff70]">CÉL:</div><div>Juttasd át a hajót a <b class="text-[#bfffab]">jobb szélről (J oszlop)</b> a <b class="text-[#bfffab]">bal szélre (A oszlop)</b> <b class="text-[#bfffab]">zátony érintése nélkül</b>! A bal szél bármelyik mezőjén átjutva nyersz – az ikon sorában extra bónuszt is szerzel.</div><div class="mt-[6px] font-bold underline tracking-wider text-[#ff9933]">AKADÁLYOK A SZEKTORBAN:</div><div id="info-obstacles-line" class="text-[#ff9933] font-bold"></div><div class="mt-[6px] font-bold underline tracking-wider text-[#8aff70]">SZONÁR:</div><div>Kattints egy cellára! Azonnal látod, van-e ott <b class="text-[#bfffab]">zátony (X)</b> vagy <b class="text-[#bfffab]">nyílt víz (0)</b>, a hullámkör pedig felfedi a <b class="text-[#bfffab]">szomszédos sziklák számát</b>.</div><div class="mt-[6px] font-bold underline tracking-wider text-[#8aff70]">TÉRKÉP:</div><div>Jelöld meg a <b class="text-[#bfffab]">feltételezett sziklákat vagy a nyílt vizet (X)</b> (ismételt kattintással törölhető). Az <b class="text-[#bfffab]">Abakuszon</b> számolhatod a zátonyokat.</div><div class="mt-[6px] font-bold underline tracking-wider text-[#8aff70]">ÚTVONAL:</div><div>Kösd össze a hajót a <b class="text-[#bfffab]">bal széllel</b> (<b class="text-[#bfffab]">átlós lépés</b> is érvényes, a lerakott pontra kattintva <b class="text-[#bfffab]">visszatörölhető</b>).</div><div class="mt-[6px] font-bold underline tracking-wider text-[#8aff70]">START:</div><div>A hajó elindul a kijelölt úton. Zátonyba ütközéskor (<b class="text-[#bfffab]">-1 Szerkezet</b>) a megállt hajótól <b class="text-[#bfffab]">ciklámen vonallal újratervezhetsz</b>.</div><div class="mt-[10px] font-bold underline tracking-wider text-[#8aff70]">JELMAGYARÁZAT:</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">Sorozat:</b> A sikeres szonár küldetések száma.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">Navi pont:</b> A sikeres küldetés megnöveli a Navigációs képzettséget (<b class="text-[#bfffab]">100 Navi pont = 0.1%</b> képzettség növekedés). Ez a számláló az összesen eddig megszerzett navigációs pontok számát mutatja.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">Szonár:</b> Az indítható szonár jelek száma.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">Szerkezet:</b> A hajó életereje – minden ütközéssel eggyel csökken.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">AN kapcsoló:</b> Az AutoNavigáció bekapcsolása. Biztonságos átkelés a szektoron, de <b class="text-[#bfffab]">0 Navi pont</b> jár érte.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">SM:</b> A Szonár játék zenéje.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">SS:</b> A Szonár hangok hangereje.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">GM:</b> A főjáték zenéje.</div><div class="mt-[4px]"><b class="text-[#bfffab] underline">GS:</b> A főjáték háttérhangja.</div></div><div class="text-center text-xs opacity-80 border-t border-[#39ff14]/30 pt-1.5 mt-1 cursor-pointer">[Kapcsold le az INFÓ kapcsolót vagy kattints ide a bezáráshoz]</div>'; box.onclick = () => { imgInfoDown.classList.remove('hidden'); box.classList.add('hidden'); crtEl.classList.remove('invisible'); }; crtEl.parentElement.appendChild(box); } const rk = (window.SonarEngine && window.SonarEngine.state && window.SonarEngine.state.rockCounts) || { small: 4, medium: 2, large: 1, wreck: 0 }; const obsEl = document.getElementById('info-obstacles-line'); if (obsEl) { const parts = [`${rk.small} db 1-es`, `${rk.medium} db 2-es`, `${rk.large} db 3-as`]; if (rk.wreck > 0) parts.push(`${rk.wreck} db 4-es`); obsEl.textContent = parts.join(', '); } box.classList.toggle('hidden', !isUp);
      });
    });
  </script>
