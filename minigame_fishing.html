<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>eBookPirates – Hártyavadász 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe id="game-frame" allow="autoplay; fullscreen" scrolling="no"></iframe>

  <script>
    (function () {
      const frame = document.getElementById('game-frame');
      const search = window.location.search || '';
      const params = new URLSearchParams(search);

      // Kényszerített fishing mód beállítása
      params.set('mode', 'fishing');
      if (!params.has('v')) {
        params.set('v', Date.now().toString());
      }

      const targetUrl = 'demojatek/tutorial_fixed.html?' + params.toString();
      frame.src = targetUrl;

      // Üzenetek közvetítése a szülő ablak (app.js) felé vagy önálló Live Server átirányítás
      window.addEventListener('message', function (event) {
        if (event.data && (event.data.source === 'threejs-minigame' || event.data.action === 'threejs_loaded' || event.data.action === 'save_game_state')) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(event.data, '*');
          } else if (event.data.status === 'COMPLETED') {
            const targetPage = event.data.targetPage || (event.data.exitType === 'DESTROYED' ? 'hajomuhely_oldal' : 'fedelzet_oldal');
            window.location.href = targetPage + '.html';
          }
        }
      });
    })();
  </script>
</body>

</html>
