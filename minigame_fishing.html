<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>eBookPirates – Hártyavadász 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe id="game-frame" allow="autoplay; fullscreen" scrolling="no"></iframe>

  <script>
    (function () {
      const frame = document.getElementById('game-frame');
      const search = window.location.search || '';
      const params = new URLSearchParams(search);

      // Kényszerített fishing mód beállítása
      params.set('mode', 'fishing');
      if (!params.has('v')) {
        params.set('v', Date.now().toString());
      }

      const targetUrl = 'Membrane_Hunting/tutorial_fixed.html?' + params.toString();
      frame.src = targetUrl;

      // Backend hívások továbbítása a fő alkalmazás (app.js) felé
// === [#HEX:F.06.69.00] START | name: callBackend | lines: 8 ===
// @calls: none | @calledBy: none
      window.callBackend = function () {
        if (window.parent && window.parent !== window && typeof window.parent.callBackend === 'function') {
          return window.parent.callBackend.apply(window.parent, arguments);
        }
        if (window.top && window.top !== window && typeof window.top.callBackend === 'function') {
          return window.top.callBackend.apply(window.top, arguments);
        }
      };
// === [#HEX:F.06.69.00] END ===

      // Üzenetek közvetítése a szülő ablak (app.js) felé vagy önálló Live Server átirányítás
      window.addEventListener('message', function (event) {
        if (!event.data) return;
        if (
          event.data.source === 'threejs-minigame' ||
          event.data.type === 'EBOOK_PIRATES_TUTORIAL' ||
          event.data.action === 'threejs_loaded' ||
          event.data.action === 'save_game_state'
        ) {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(event.data, '*');
          } else if (event.data.status === 'COMPLETED') {
            const targetPage = event.data.targetPage || (event.data.exitType === 'DESTROYED' ? 'hajomuhely_oldal' : 'fedelzet_oldal');
            window.location.href = targetPage + '.html';
          } else if (event.data.action === 'navigate_to_page') {
            const page = event.data.page || 'kikoto_oldal';
            window.location.href = 'index.html?page=' + encodeURIComponent(page) + (event.data.auto_workshop ? '&auto_workshop=1' : '');
          }
        }
      });
    })();
  </script>
</body>

</html>
